[package]
name = "liquidvoice"
version = "0.1.0"
description = "Liquid-animated STT dictation for Windows"
authors = ["sucra"]
edition = "2021"

[lib]
name = "liquidvoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
reqwest = { version = "0.12", features = ["multipart", "json", "rustls-tls"], default-features = false }
tokio = { version = "1", features = ["full"] }
hound = "3.5"
dirs = "6"
tauri-plugin-autostart = "2"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_Foundation"] }
window-vibrancy = "0.6"
